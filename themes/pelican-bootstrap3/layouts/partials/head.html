<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} - {{ site.Title }}{{ end }}</title>
{{- $desc := .Description | default .Summary | default site.Params.description }}
<meta name="description" content="{{ $desc | plainify | chomp }}">
{{ with site.Params.author.name }}<meta name="author" content="{{ . }}">{{ end }}
<link rel="canonical" href="{{ .Permalink }}">
{{ if .Params.noindex }}<meta name="robots" content="noindex, nofollow">{{ end }}

<link rel="icon" href="{{ "favicon.ico" | absURL }}">

<link rel="stylesheet" href="{{ "css/bootstrap.min.css" | relURL }}">
<link rel="stylesheet" href="{{ "css/font-awesome.min.css" | relURL }}">
<link rel="stylesheet" href="{{ "css/pygments.css" | relURL }}">
<link rel="stylesheet" href="{{ "css/style.css" | relURL }}">

{{ with .OutputFormats.Get "RSS" }}
<link href="{{ .Permalink }}" type="application/rss+xml" rel="alternate" title="{{ site.Title }} RSS Feed">
{{ end }}
