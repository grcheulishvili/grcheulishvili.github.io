{{ define "main" }}
<div class="panel panel-warning">
  <div class="panel-heading">{{ i18n "untranslated_title" }}</div>
  <div class="panel-body">
    <p>{{ i18n "untranslated_body" | safeHTML }}</p>
    <a class="btn btn-primary" id="ut-cta" href="#" style="display:none">{{ i18n "untranslated_cta" }}</a>
    <a class="btn btn-default" href="{{ "" | relLangURL }}">{{ i18n "untranslated_home" }}</a>
  </div>
</div>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  var from = p.get("from");
  if (from) {
    var c = document.getElementById("ut-cta");
    c.setAttribute("href", from);
    c.style.display = "";
  }
})();
</script>
{{ end }}
